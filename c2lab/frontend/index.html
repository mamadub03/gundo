<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>C2 Lab Controller</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; }
    button { padding: .6rem 1rem; font-size: 1rem; cursor: pointer; }
    pre { background: #f4f4f4; padding: 1rem; border-radius: 6px; min-height: 3rem; }
  </style>
</head>
<body>
  <h1>C2 Lab Controller</h1>
  <button id="btn">Get Hostname</button>
  <pre id="out"></pre>

  <script>
    const btn = document.getElementById('btn');
    const out = document.getElementById('out');
    // CHANGE this to your own AGENT_ID (must match what the agent uses)
    const AGENT_ID = 'agent-amour';

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      const taskId = crypto.randomUUID();
      const task = { task_id: taskId, agent_id: AGENT_ID, action: 'hostname' };

      out.textContent = 'Submitting task ' + taskId + '...';

      const r = await fetch('/task', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(task),
      });
      if (!r.ok) {
        out.textContent = 'Submit failed: ' + (await r.text());
        btn.disabled = false;
        return;
      }

      const deadline = Date.now() + 120000;
      const timer = setInterval(async () => {
        if (Date.now() > deadline) {
          clearInterval(timer);
          out.textContent = 'Timed out waiting for result.';
          btn.disabled = false;
          return;
        }
        const res = await fetch('/result?task_id=' + encodeURIComponent(taskId));
        if (res.status === 200) {
          const data = await res.json();
          out.textContent = 'Result: ' + data.output;
          clearInterval(timer);
          btn.disabled = false;
        }
      }, 2000);
    });
  </script>
</body>
</html>
